nd:#eadcdf;margin:12px 0 35px}.progress span{display:block;background:var(--accent);height:100%;transition:width .2s}.topline,.nav{display:flex;justify-content:space-between;gap:18px;align-items:center}.question{padding:22px 0 27px;border-bottom:1px solid var(--line)}legend{font-size:17px;line-height:1.6;padding:0;margin-bottom:17px}fieldset{border:0;margin:0;padding:0}.ratings{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;max-width:700px}.rating{position:relative;text-align:center;margin:0}.rating input{position:absolute;opacity:0;inset:0}.rating span{display:block;padding:10px 0;border:1px solid #cdb6ba;cursor:pointer}.rating input:checked+span{background:var(--accent);color:white;border-color:var(--accent)}.rating input:focus-visible+span{outline:3px solid #702f35}.anchors{display:flex;justify-content:space-between;max-width:700px;font-size:10px;color:var(--muted);margin:6px 0 14px}.na{font-size:12px;display:flex;gap:8px;align-items:center;margin:0}.nav{margin-top:28px}.error{color:#702f35;font-size:13px;margin-top:15px}.report{max-width:740px;margin:auto}.report p{line-height:1.95}.report-head{border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:35px}.report h1{font-size:67px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.score{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.score b{float:right}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}.note{padding:15px 20px;background:#f0e4e6;font-size:12px}.report blockquote{border-left:2px solid var(--accent);padding-left:20px;font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1.4;margin:25px 0}details{margin:25px 0}summary{cursor:pointer;font-size:12px}.footer{margin-top:65px;border-top:1px solid var(--line);padding-top:20px;font-size:11px;color:var(--muted)}@media(max-width:750px){main{padding:35px 20px}.hero{grid-template-columns:1fr;gap:25px}.panel{padding:22px}header{padding:20px}.ratings{gap:4px}.rating sp </style></head><body><header><a href="#" id="brand">MARIJA MESHKOVA</a><span class="badge">THE IDENTITY THRESHOLD</span></header><main id="app"></main><script>
'use strict';
const DATA={"questions": ["I keep commitments that no longer work for me because changing them would disappoint someone.", "I believe that if I loosen my personal day-to-day involvement or tracking of a project, something critical will inevitably be missed.", "I continue refining, changing, tweaking work or emails after I finish them because I can still imagine someone finding fault with it.", "I feel most secure in my role when people depend on what I provide.", "After a significant achievement, I feel pressure to prove I can deliver at that level again.", "I hold back from an opportunity I could reasonably pursue because I feel I need more credentials, results, or recognition first.", "I can maintain a boundary or considered decision without needing the other person to approve of it.", "I often gauge whether a high-stakes meeting went well based on how warm, included, and comfortable everyone felt with me at the end.", "When I look at a task assigned to someone else, a voice in my head says, “I can just do this better and faster myself,” so I end up taking the work back or heavily rewriting it because I can’t trust how they’ll deliver.", "I hold back my thinking until I can answer most of the questions people might ask.", "I feel a profound wave of security when a crisis hits and the thought crosses my mind, “See? They literally cannot fix this mess without me. They need me here.”", "I find it difficult to enjoy quieter periods because being less productive makes me question my value.", "After reaching a milestone I expected would make me ready, I identify another requirement before putting myself forward.", "I allow someone else to choose the method when we have agreed on the outcome, standards, and limits.", "I delay or avoid setting firm boundaries because I am worried it will weaken my long-term relationship or place in the group.", "I check progress beyond our agreed review points because I find it difficult to leave the outcome unverified.", "When someone identifies a weakness in my work, I worry that they will question my wider competence.", "I catch myself jumping in to solve a problem or do the heavy lifting for a colleague before they even ask for help, simply because watching them struggle makes me too uncomfortable to sit still.", "If I have a day filled with quiet, high-level strategic thinking but don’t cross a tangible item off my tactical to-do list, I end the day feeling deeply guilty, lazy, and unproductive.", "I find it easier to explain an established framework than to state my own recommendation.", "I put work forward once it meets its purpose, even when I can still see room for improvement.", "If a high-stakes meeting ends with someone looking cold, distant, or upset with me, I walk away feeling like the whole interaction was a total failure, no matter what business goals were met.", "I feel responsible for preventing mistakes in delegated work, even when the person responsible has the authority and resources to handle it.", "After delivering something successfully, I remain preoccupied with the parts I could have done better.", "I treat my inbox and Slack like a life-support machine. If I don’t answer a notification within five minutes—even at midnight—I feel an intense anxiety that I am failing my team.", "I treat tasks like an emotional drug. The moment my calendar has an empty two-hour block, I feel a sudden panic of stagnation, so I immediately find an operational fire to fight or an administrative task to build.", "I avoid clearly stating what I offer or the value I bring unless I can support it with qualifications or external recognition.", "I allow people to resolve difficulties within their responsibility, even when stepping in would make me feel useful.", "I find myself constantly overexplaining my reasons or going on a “reassurance tour” after making a tough decision.", "I delay handing over work because I haven’t found someone who would do it the way I would.", "I look at things we are ready to launch, publish, or pitch and think, “It’s good, but it’s not ready.” I will weaponize “quality assurance” to delay exposure because the thought of being judged makes my stomach turn.", "When my team or co-founders start running complex parts of the business seamlessly without asking for my input or approval, a small, dark part of me feels totally anxious, abandoned, and irrelevant.", "I literally do not know how to justify rest. Unless I am physically ill or completely broken, taking time off feels like I am falling behind and letting down the business.", "The moment a high-profile board member, veteran investor, or prestigious authority figure enters the room, I immediately shrink my presence, quiet my voice, and defer to their stance.", "I protect time for work that moves my own priorities forward, even when completing immediate tasks would feel more satisfying.", "I soften my price, terms, or expectations when I sense the other person is uncomfortable.", "I tell people they have full autonomy, but because I’m terrified to mess up in front of my boss or my clients if something goes wrong, I secretly log in at night to double-check their work or interrogate them with micro-questions under the guise of “getting aligned.”", "I avoid opportunities where I would need to learn while other people can see my mistakes.", "I postpone stepping back from responsibilities because I worry about becoming less important to the people involved.", "I postpone work on direction, visibility, or growth because immediate tasks give me a clearer sense of accomplishment.", "I give someone’s prestigious credentials more weight than my own relevant experience when deciding whether to trust my judgment.", "I actively put myself forward for opportunities that match what I can contribute, even when I still want more reassurance that I am ready."], "names": ["The Peacekeeper", "The Backseat Driver", "The Inner Critic", "The Fixer", "The Workhorse", "The Eternal Student"], "explanations": ["You pay close attention to how people receive you, and preserving harmony can become more urgent than expressing what you genuinely think or need. You can enter a conversation clear about your position and leave having adjusted it because someone seemed unhappy.", "You can hand over the work while remaining mentally in charge of how it gets done. You watch the details, question the method, and stay ready to intervene. Even when someone has responsibility, stepping back can feel careless.", "You have a sharp eye for what could be stronger, clearer, or harder to challenge. But that eye can stay fixed on the weakness long after the work has met its purpose. Being seen starts to depend on satisfying a standard that can always find another reason to wait.", "You notice what needs doing and become the person who makes it manageable. Solving the problem gives others relief, and being needed can reassure you that your place matters. You can long for more independence around you and still feel unsettled when people begin managing without your help.", "You know how to earn your place through effort, reliability, and results. But producing can become the main way you reassure yourself that you’re valuable. You keep giving people more evidence of what you can carry while your broader contribution waits for space.", "You take becoming qualified seriously, but the point at which you feel entitled to contribute keeps moving. Learning gives you a clear route to follow. Claiming an opportunity asks you to trust your judgment without knowing whether someone else will confirm that you’re ready."], "opens": ["You want to lead more boldly, trust your decisions, and have your ideas carry weight. Yet when someone seems disappointed or unconvinced, you can find yourself softening a position you were clear about moments earlier. You explain again, adjust the expectation, or check in afterward to make sure things are okay.", "You want to grow without being involved in everything. You want people who take ownership, make sound decisions, and move work forward without constantly coming back to you. Yet when an important outcome depends on someone else, stepping back can feel irresponsible.", "You want your ideas to carry weight. You want to be more visible, make a greater impact, and be recognized for the quality of your thinking. Yet when it’s time to put something forward, you can still see what needs improving. It’s good, but it’s not ready.", "You want more space to lead, make bigger moves, and grow beyond being the person everyone turns to for everything. Yet when someone struggles, you find it difficult to leave the problem with them. And when a crisis hits, part of you may feel reassured: They need me. I have a place here.", "You want greater influence, more room to shape direction, and success that doesn’t require you to keep increasing your personal output. Yet delivering feels like the clearest way to earn your place. You take on another task and push your own priorities further down the list.", "You want to put yourself forward, claim bigger opportunities, and be recognized for what you can contribute. Yet when the opportunity gets closer, you start noticing what you still lack. Another qualification. Stronger results. More recognition. You keep finding another condition to meet."], "rules": ["I should be able to do what’s necessary without anyone feeling negatively toward me.", "If I can prevent something from going wrong, I should. If it goes wrong without me, I should have been paying closer attention.", "If I’m genuinely good at what I do, I should be able to anticipate objections and prevent people from finding weaknesses.", "My place is secure as long as I provide something people cannot do without.", "I earn my place through what I produce. If I’m capable of doing more, I should.", "Before I can claim this space, I need enough external proof that nobody can reasonably question whether I belong."], "costs": ["That rule makes greater authority expensive. Your team, clients, or colleagues receive a diluted version of your thinking. Boundaries become open to negotiation. You accept commitments that later leave you resentful. Meanwhile, the decisions and opportunities that could move you forward keep requiring someone else’s emotional green light.", "When progress repeatedly depends on your review, your team can start stepping back. They wait for your decision or stop taking initiative because they expect you to rewrite the work anyway. You end up carrying more, increasingly frustrated that nobody seems to take ownership, while your involvement leaves them less room to develop it.", "That rule makes being seen expensive. You spend hours preparing to defend points nobody has questioned. You hold back ideas while the conversation moves on. You gain more practice perfecting things privately while postponing the experiences that would help you become steadier in public.", "Your own priorities get displaced by whoever needs you next. You become frustrated with the dependence, yet each rescue helps keep your role essential. You can end up treating your presence like a subscription you must keep renewing through usefulness, while the system around you remains dependent on your intervention.", "People keep seeing the contribution you consistently make available: your ability to execute. They bring you more delivery work. As a founder, you can build yourself a demanding job inside your own business. As a leader, you can become known for carrying the workload while your strategic perspective remains less visible.", "The offer stays unspoken. The application remains unfinished. The idea becomes another subject to research. And, while you are busy studying the map to ensure you are fully permitted to speak, or act, competitors with a fraction of your knowledge but twice your courage are out in the real world building roads, making mistakes, and taking the market."], "capacities": ["The capacity you need to grow is the ability to stay present through uncertainty without immediately resolving it through accommodation. To let a considered answer remain an answer. To hear an objection to your price without turning it into a question about your worth.", "The capacity you need to grow is the ability to remain steady when an outcome matters and you aren’t personally directing every step. To distinguish a genuine risk from the discomfort of having less visibility. To address a mistake without automatically making the work yours again.", "The capacity you need to grow is the ability to remain connected to your competence while its limitations are visible. To acknowledge a mistake without urgently explaining everything that led to it. To let work meet its purpose without requiring it to protect your entire reputation.", "The capacity you need to grow is the ability to feel secure in your place while allowing your usefulness to fluctuate. To receive support without immediately earning it back. To welcome someone’s independence without searching for another way to become necessary.", "The capacity you need to grow is the ability to remain connected to your value when you aren’t producing immediate evidence of it. To protect time for direction while tasks remain unfinished. To rest without waiting until exhaustion makes the decision for you.", "The capacity you need to grow is the ability to contribute without securing another endorsement first. To recognize a genuine gap in competence without treating every feeling of uncertainty as evidence of one. To remain connected to your experience around someone with a more impressive title."], "beyond": ["Beyond this threshold, your decisions can become clearer and your requests more honest. You can change an arrangement before resentment builds and put forward an idea before you know it will be welcomed. You can care deeply about your relationships while giving your judgment a dependable place within them.", "Beyond this threshold, delegation can create the space you hoped it would. People can develop judgment because they have room to exercise it. Your influence can reach further through direction and the capability of others, while more of your attention becomes available for the work only you can lead.", "Beyond this threshold, you can contribute while the discussion is still taking shape, test an offer while there’s time to learn, and discover that a question you didn’t anticipate doesn’t have to diminish your authority.", "Beyond this threshold, you can develop people who carry responsibility, build systems that function in your absence, and protect space for the ideas and opportunities you keep putting last. You can be valued without keeping everyone dependent on your effort.", "Beyond this threshold, you can make your thinking visible and create room for opportunities that don’t come with a ready-made task list. Your contribution can expand through the direction you set, the decisions you make, and the work you choose to stop carrying.", "Beyond this threshold, you can pursue opportunities that match what you bring today. You can use established knowledge while giving people access to your conclusions. Your experience begins to shape decisions because you’re willing to put it forward."], "pairs": [[null, "You stay closely involved, then soften your expectations when someone pushes back. You might take the work back rather than let a difficult conversation remain difficult. You’re left carrying the outcome while managing the tension around it.", "You refine the wording and anticipate objections, hoping preparation will make your contribution easier to accept. Yet one cold response can leave you questioning the interaction. Your threshold includes allowing good work to receive a reaction you could not prevent.", "Being helpful gives you a dependable way to feel accepted. Changing the arrangement risks both disappointment and discovering that people can manage without you. Your own priorities keep waiting while you preserve a role that is becoming exhausting.", "You keep delivering, hoping the results will make your value obvious enough that asking for more becomes easier. Your workload grows while your ambition remains politely implied. Your threshold includes making an honest request before adding another achievement or concession.", "Another qualification or endorsement seems as though it could make disapproval easier to withstand. People encounter your knowledge without fully encountering your judgment. Your threshold includes expressing a considered view before an established person authorizes it."], ["You check more or quietly correct things rather than hold one direct conversation about what needs to change. Your threshold includes leaving responsibility with someone while tolerating their reaction to a clear expectation.", null, "An acceptable result may leave you uneasy because you know how you would refine it. People learn that meeting the agreement may still be insufficient. Your threshold includes distinguishing a meaningful quality issue from a difference in preference.", "Staying involved reassures you that the outcome is secure and that you still matter to it. Your threshold includes welcoming someone’s growing judgment without searching for another point of control.", "Doing the work yourself offers relief and something tangible to show for your effort. Each intervention gives others fewer opportunities to carry the outcome. Your threshold includes leaving room for someone else’s learning curve.", "More research or another expert opinion promises reassurance, but the point at which you know enough keeps moving. Your threshold includes acting on sufficient evidence while acknowledging what remains unknown."], ["You work on the idea and on making it impossible to misunderstand or dislike. Your threshold includes letting good work exist alongside mixed reactions, without treating a question as a failed performance.", "Even after someone meets the brief, you can see details to correct. Your threshold includes allowing quality through an approach you would not have chosen, without requiring your fingerprints on every part.", null, "Being the person who catches every weakness can become central to your place in the team. Your threshold includes allowing quality to become something others can sustain without your final review.", "You demand high volume and exceptionally polished work, then judge yourself for how long everything takes. Your threshold includes letting work meet its purpose and stop, without converting success into tomorrow’s minimum.", "The work needs refinement and you need more experience. Another course promises to settle the gap, but reveals another requirement. Your threshold includes releasing a useful contribution without making it prove complete readiness."], ["Changing an arrangement feels like withdrawing something that keeps a relationship close. Your threshold includes allowing your place to survive an honest limit.", "You remain the person who checks, resolves, and approves. Your threshold includes accepting that others’ capability may make you less necessary in daily work while opening a different contribution.", "Your ability to improve things makes you the person everyone waits for. Your threshold includes letting others own work that meets its purpose without your final refinement.", null, "The more you produce, the more people rely on you; the more they rely on you, the harder it becomes to stop. Your threshold includes protecting your direction before everyone else has what they need.", "Solving another problem provides immediate evidence that you belong. Your threshold includes putting forward what you want to lead before securing your place through more service."], ["Declining another request feels like risking the recognition you have worked hard to earn. Your threshold includes letting someone encounter a limit before you exhaust yourself making everything work.", "Taking over feels efficient and gives you visible progress. Your threshold includes accepting a different pace within clear limits so collective capacity can develop.", "You expect yourself to deliver a great deal and make each contribution difficult to fault. Your threshold includes allowing completion to be real, without adding a final round of proof.", "Completing other people’s tasks reassures you of your value while your priorities remain postponed. Your threshold includes letting people manage without your immediate contribution.", null, "There is always another target before the proposal or change in direction. Your threshold includes using the evidence you already have rather than requiring another achievement before putting yourself forward."], ["An endorsement seems as though it could protect you from an uncomfortable response. Your threshold includes remaining present around established people without making yourself smaller.", "Your need to feel qualified becomes entangled with a need to feel certain. Your threshold includes naming what remains unknown and allowing experience to answer what preparation cannot.", "You keep preparing the person and polishing the contribution. Each route returns you to another readiness requirement. Your threshold includes contributing while both you and the work remain open to development.", "Being consulted confirms that your expertise matters, while claiming your own direction feels exposed. Your threshold includes letting your knowledge serve your own ambition too.", "You return to delivery because another completed project feels more concrete than putting yourself forward. Your threshold includes claiming an opportunity before removing every doubt about deserving it.", null]], "choice": [["You may know exactly what you want to say before the conversation and still hear yourself softening it when someone reacts badly. Afterward, you can see where you abandoned your position. In the moment, restoring their comfort feels urgent. Your threshold is developing enough room to stay with your judgment while that reaction unfolds—to hear what they’re saying, consider what matters, and let your answer stand when nothing relevant has changed.", "You can agree that someone owns the outcome and still struggle to leave the method in their hands. As soon as uncertainty rises, your attention returns to the details. Checking or intervening feels responsible, and stepping back feels like taking an unnecessary risk. Your threshold is creating enough space to assess what the work actually requires before your discomfort decides your involvement. That gives someone else’s ownership a chance to become real.", "You may recognize that the work meets its purpose and still find it difficult to release. Another revision offers something immediate: a little more reassurance before anyone can respond. Putting it forward asks you to carry the uncertainty that refining temporarily relieves. Your threshold is becoming able to act while you can still see imperfections—to let the contribution enter the conversation and remain present for whatever useful information comes back.", "You may know that someone needs room to work through a difficulty and still feel compelled to help. Leaving it with them can bring guilt, restlessness, or uncertainty about what you should be contributing. Stepping in settles something for you, even as it adds to your load. Your threshold is being able to remain available without making yourself responsible—and allowing your place to feel secure when your intervention isn’t needed.", "You may intend to protect time for direction or growth, then find yourself returning to immediate tasks. Completing something gives you a clear sense of accomplishment; your own priorities can feel harder to justify while other work remains unfinished. Your threshold is staying with a deliberate priority through that discomfort, allowing a decision, a conversation, or a clearer direction to count before you’ve filled the day with visible output.", "You may see an opportunity that matches your contribution and still hesitate to put yourself forward. Another result, qualification, or endorsement feels as though it would make the move easier to justify. While you pursue it, the opportunity remains untouched. Your threshold is recognizing when your competence is sufficient for a responsible step and allowing yourself to take it while some uncertainty about your legitimacy remains."], ["There are already moments when you hold your position without needing everyone to approve. Then a particular person, a more important relationship, or a stronger reaction makes that choice harder to access. You may leave wondering why something you managed last week felt impossible today. Your threshold is making that capacity more dependable, especially around the people whose disappointment still carries enough weight to pull you away from yourself.", "You can give people room when the work is familiar, the stakes feel manageable, or you trust the person involved. But under greater pressure, you may return to prescribing, checking, or taking over. You already have evidence that another approach is possible. Your threshold is extending that capacity into more demanding circumstances, while remaining clear about which risks genuinely require closer involvement and which uncertainties you can allow.", "Sometimes you can put the work forward and let it be questioned. Other times, a larger audience, an unfamiliar opportunity, or someone whose judgment matters sends you back into preparation. Your standards become more demanding as the exposure becomes more personal. Your threshold is recognizing those shifts and retaining access to the choice you already make elsewhere: sharing considered work while there is still something left to improve.", "There are times when you can leave responsibility with its owner and welcome their independence. Then someone struggles, a crisis appears, or you feel less included, and helping becomes difficult to resist. You already have some room to choose. Your threshold is keeping that room available when being needed feels especially reassuring, so another person’s difficulty doesn’t automatically become the route back to feeling important.", "You already make room for your own priorities sometimes. Then deadlines build, requests arrive, or a quieter day leaves you uneasy, and execution takes over again. Strategic space becomes something you can protect only when everything else is manageable. Your threshold is making that space part of how you operate under pressure, while accepting that some immediate work will remain unfinished and some people may need to wait.", "You already put yourself forward in some circumstances. But around prestigious people, larger opportunities, or unfamiliar expectations, the readiness requirements can rise again. Experience you trusted yesterday starts to feel insufficient. Your threshold is carrying a realistic assessment of your competence into those rooms, so another person’s status or the size of the opportunity doesn’t automatically send you back to earning permission."], ["You already report being able to maintain a boundary or decision without securing the other person’s approval. That matters. The pull toward accommodation may still be present, but it doesn’t always determine your response. Your next threshold may involve what happens afterward: how long you replay the exchange, whether you quietly compensate, or whether certain relationships still make your position harder to hold. There may be more freedom available within choices you’re already making.", "You already report allowing people to choose their methods within clear outcomes, standards, and limits. Your next threshold may be less visible: whether you can mentally leave the work with them, whether their first difficulty pulls you back in, and whether the same trust remains available as the stakes rise. There may be room to reduce the attention you spend supervising internally, even when you’re already giving people space externally.", "You already report putting work forward once it meets its purpose, even when you see room for improvement. That is a meaningful capacity. The next place to look is the cost surrounding that choice: how much preparation precedes it, how you treat yourself afterward, and whether feedback remains with you longer than it needs to. Your threshold may involve carrying visibility with less internal punishment while continuing to care about quality.", "You already report letting people resolve difficulties within their responsibility, even when stepping in would make you feel useful. Your next threshold may involve how you experience the space their independence creates. Can you enjoy it, receive support, and pursue your own direction—or do you quickly fill it with another place to become necessary? You may be ready to discover a more secure sense of contribution beyond the role you’ve learned to provide.", "You already report protecting work that moves your priorities forward, even when immediate tasks would feel more satisfying. The next question is whether you can let that choice be enough. Do you compensate with extra hours later, measure the day harshly, or struggle to rest after making good use of your attention? Your threshold may involve keeping the space you’ve created without quietly repaying it through more work.", "You already report pursuing opportunities that match your contribution, even while wanting more reassurance. That means you’re building experience in acting before complete confidence arrives. Your next threshold may be what happens once you’re there: whether you express your own recommendation, maintain your presence around established people, and let your relevant experience influence the discussion. Claiming the opportunity can open the door to occupying it more fully."]], "cores": [{"opening": "You want to lead more boldly, trust your decisions, and have your ideas carry weight. Yet when someone seems disappointed or unconvinced, you can find yourself softening a position you were clear about moments earlier. You explain again, adjust the expectation, or check in afterward to make sure things are okay.", "rule": "You may already recognize this pattern. Before the conversation, you know what you want to say. But when the discomfort arrives, keeping the relationship comfortable starts to feel more urgent than maintaining your position. Somewhere in your definition of good leadership, you may be carrying a demanding rule: I should be able to do what’s necessary without anyone feeling negatively toward me.", "cost": ["That rule makes greater authority expensive. Your team, clients, or colleagues receive a diluted version of your thinking. Boundaries become open to negotiation. You accept commitments that later leave you resentful, then spend more energy wondering why people don’t recognize how much you’ve accommodated them. Meanwhile, the decisions and opportunities that could move you forward keep requiring someone else’s emotional green light."], "capacity": "The capacity you need to grow is the ability to stay present through that uncertainty without immediately trying to resolve it through accommodation. To let a considered answer remain an answer. To allow someone time to process feedback. To hear an objection to your price without turning it into a question about your worth. To know that you’ve been fair and thoughtful even when you don’t receive warmth in return.", "awareness": "You may have reached the point where you can explain this pattern beautifully and still find yourself repeating it. That’s a frustrating place to stay, especially when you can see the opportunities you’re holding back from. More awareness gives you language for the loop. Crossing this threshold requires more room to choose while you’re actually inside it.", "beyond": "Beyond it, there’s a different way to carry your authority. Your decisions can become clearer. Your requests can become more honest. You can change an arrangement before resentment builds, put forward an idea before you know it will be welcomed, and let people encounter more of what you genuinely think. You can care deeply about your relationships while giving your own judgment a dependable place within them.", "invite": "If you recognize yourself here, this is the work we can deepen together. We strip back the patterns and internal rules that keep following you into how you lead, communicate, make decisions, perform under pressure, create impact and literally put yourself forward.", "question": "What becomes possible when someone’s disappointment no longer decides how much of yourself you’re willing to express? When you can ask for the opportunity, state the terms, or hold the expectation without spending the next two days trying to make sure everyone still feels good about you?", "closing": "You’ve already shown how much you can do while carrying that responsibility. There’s more to discover when you have the capacity to put some of it down. That’s what we get to explore beyond your threshold."}, {"opening": "You deeply desire to step into bolder leadership, hold more authority, and lead your team with clear, unshakeable influence. You want to grow without being involved in everything. You want people who take ownership, make sound decisions, and move work forward without constantly coming back to you. Yet when an important outcome depends on someone else, stepping back can feel irresponsible. You check the details, ask another question, or take something back because you can see how to do it better and faster yourself.", "rule": "You may already recognize that you’re becoming the bottleneck. You’ve probably told yourself to delegate more and give people space. But when uncertainty arrives, staying involved feels necessary again. Somewhere in your definition of responsibility, you may be carrying a demanding rule: If I can prevent something from going wrong, I should. If it goes wrong without me, I should have been paying closer attention.", "cost": ["That rule makes your attention a requirement for progress. You hand over the task but keep the decisions. You are carrying an exhausting operational load, and the business can only move as far as your personal bandwidth allows. When progress repeatedly depends on your review, your team can start stepping back. They wait for your decision, bring unfinished problems to you, or stop taking initiative because they expect you to rewrite the work anyway. You end up carrying more, increasingly frustrated that nobody seems to take ownership, while your involvement leaves them less room to develop it. Leadership starts to feel lonely when so much still depends on you.", "There’s a personal cost, too. Even when you’re away from the work, part of your attention stays with it. You wonder whether something has been missed. Checking brings relief, but that relief rarely lasts long enough to let you fully disengage. The space you wanted for bigger decisions, stronger relationships, and your own direction keeps getting consumed by constant oversight."], "capacity": "The capacity you need to grow is the ability to remain steady when an outcome matters and you aren’t personally directing every step. To let someone use a different method without immediately correcting it. To allow an agreed review point to arrive without checking early. To distinguish a genuine risk from the discomfort of having less visibility. To address a mistake without automatically making the work yours again.", "awareness": "You may understand all of this but still find your hand reaching back into the work. Sounds familiar? :) Crossing this threshold means having more choice at precisely that moment—when intervening would make you feel better, but the situation may not require it. Your judgment needs enough room to assess what is happening before your discomfort determines your involvement.", "beyond": "Beyond this threshold, delegation can create the space you hoped it would. People can develop judgment because they have room to exercise it. Your influence can reach further through direction and the capability of others, while more of your attention becomes available for the work only you can lead.", "invite": "If you recognize yourself here, this is the work we can deepen together. We strip back the patterns and internal rules that keep following you into how you lead, communicate, make decisions, perform under pressure, create impact, and put yourself forward—including the ones that have made you reliable and exceptionally good at keeping things together.", "question": "What becomes possible when uncertainty no longer pulls you straight back into supervision? When you can trust an agreement, let someone carry responsibility, and remain available without staying mentally attached to every detail?", "closing": "You’ve already shown how much you can hold together through your own effort. There’s more to discover when growth can draw on the judgment and ownership of other people, too. That’s what we get to explore beyond your threshold."}, {"opening": "You want your ideas to carry weight. You want to be more visible, make a greater impact, and be recognized for the quality of your thinking. Yet when it’s time to put something forward, you can still see what needs improving. The offer needs refining. The presentation needs another pass. The recommendation needs more evidence. It’s good, but it’s not ready.", "rule": "You may already recognize how much time this costs you. You’ve probably told yourself to stop overthinking and share the work. But as the moment of being evaluated gets closer, another revision starts to feel necessary. Somewhere in your definition of competence, you may be carrying a demanding rule: If I’m genuinely good at what I do, I should be able to anticipate the objections and prevent people from finding weaknesses.", "cost": ["That rule makes being seen expensive. You spend hours preparing to defend points nobody has questioned. You hold back ideas while the conversation moves on. People encounter your thinking only after you’ve polished away the uncertainty that could have opened a useful discussion. Meanwhile, opportunities to contribute, sell, lead, or experiment remain dependent on a standard you can keep raising.", "And even when the work succeeds, you may struggle to enjoy it. Your attention goes to the sentence you stumbled over, the question you couldn’t fully answer, or the detail someone corrected. One visible weakness can start to feel like evidence against your wider competence. So the next time, you prepare even more. The achievement becomes another standard to maintain rather than an experience that helps you trust yourself.", "As long as the work is being refined, its reception remains unknown. You can keep improving it without finding out whether someone will misunderstand it, challenge it, or remain unimpressed. That can make preparation a comfortable place to stay, even while you’re frustrated with yourself for staying there. You gain more practice perfecting things privately while postponing the experiences that would help you become steadier in public."], "capacity": "The capacity you need to grow is the ability to remain connected to your competence while its limitations are visible. To share a considered idea before you can answer every question. To acknowledge a mistake without urgently explaining everything that led to it. To hear criticism, decide what is useful, and continue contributing. To let work meet its purpose without requiring it to protect your entire reputation.", "awareness": "You may understand all of this and still find yourself opening the document for another revision. Crossing this threshold means having more choice at that moment—when further refinement promises relief, but putting the work forward would give you the experience you actually need. Your standards need enough flexibility to serve the work, the opportunity, and the people receiving it.", "beyond": "Beyond this threshold, you can contribute while the discussion is still taking shape. You can test an offer while there’s time to learn from the response. You can let people build on your thinking and discover that a question you didn’t anticipate doesn’t have to diminish your authority. More of your energy becomes available for creating impact because less of it is spent trying to make your contribution impossible to criticize.", "invite": "If you recognize yourself here, this is the work we can deepen together. We strip back the patterns and internal rules that keep following you into how you lead, communicate, make decisions, perform under pressure, create impact, and put yourself forward—including the ones that have made you thorough, accomplished, and known for doing things exceptionally well.", "question": "What becomes possible when a visible imperfection no longer determines whether you feel entitled to keep speaking? When you can let an idea be questioned, an offer be tested, or a piece of work be seen without needing it to prove everything about you?", "closing": "You’ve already shown how much care you can bring to your work. There’s more to discover when that care leaves room for you to be visible, responsive, and still becoming. That’s what we get to explore beyond your threshold."}, {"opening": "You want more space to lead, make bigger moves, and grow beyond being the person everyone turns to for everything. Yet when someone struggles, you find it difficult to leave the problem with them. You step in, make yourself available, or take on something extra because you know you can help. And when a crisis hits, part of you may feel reassured: They need me. I have a place here.", "rule": "You may already recognize how much you’re carrying. You’ve probably wished people would take more initiative and stop depending on you so heavily. But when they begin managing without your input, the relief can come with an unexpected discomfort. Somewhere in your understanding of your own value, you may be carrying a demanding rule: My place is secure as long as I provide something people cannot do without.", "cost": ["That rule makes stepping back feel more consequential than changing your workload. If being useful reassures you that you matter, someone else’s independence can leave you wondering where you fit. You can sincerely want a capable team and still feel unsettled when they no longer consult you. You might find another problem to solve, another responsibility to absorb, or another reason to remain available.", "Over time, people learn to bring things to you before working through them themselves. Your knowledge stays concentrated in your head. Your own priorities get displaced by whoever needs you next. You become frustrated with the dependence, yet each rescue helps keep your role essential. The freedom you want keeps getting postponed by the reassurance you receive from being needed.", "The gap you don’t see is that you are treating your presence like a paid subscription service. You subconsciously believe that your place at the table is only secure as long as the business cannot function without your personal intervention, using your workload to prove your legitimacy. You want to scale your influence, but you are trapped at the awareness level: you complain about the burden of being needed, yet you reflexively recreate it every single day. You are burning yourself out keeping the wheels turning while keeping the entire system around you structurally fragile."], "capacity": "The capacity you need to grow is the ability to feel secure in your place while allowing your usefulness to fluctuate. To let someone struggle appropriately without making their difficulty your responsibility. To receive support without immediately earning it back. To welcome someone’s independence without searching for another way to become necessary. To remain connected to your value when there is no crisis for you to resolve.", "awareness": "You may understand all of this and still find yourself volunteering before you’ve considered whether you want to. Crossing this threshold means having more choice in that moment—when helping would reassure you, but staying out would give someone else room to develop. It also means allowing yourself to discover what you want when your attention is no longer constantly organized around other people’s needs.", "beyond": "Beyond this threshold, your contribution can become more deliberate. You can develop people who carry responsibility, build systems that function in your absence, and protect space for the ideas and opportunities you keep putting last. Your relationships can make more room for mutual support. You can be valued for your perspective, presence, and leadership without having to keep everyone dependent on your effort.", "invite": "If you recognize yourself here, this is the work we can deepen together. We strip back the patterns and internal rules that keep following you into how you lead, communicate, make decisions, perform under pressure, create impact, and put yourself forward—including the ones that have made you generous, resourceful, and the person everyone knows they can count on.", "question": "What becomes possible when being needed no longer determines how secure you feel? When people can grow, solve problems, and succeed without you having to wonder whether their independence makes you less important?", "closing": "You’ve already shown how much value you can bring to other people. There’s more to discover when your place no longer feels like something you have to keep earning through usefulness. That’s what we get to explore beyond your threshold."}, {"opening": "You want greater influence, more room to shape direction, and success that doesn’t require you to keep increasing your personal output. Yet when there’s work to be done, delivering feels like the clearest way to earn your place. You take on another task, solve another problem, and push your own priorities further down the list. You know how to make yourself valuable through execution. Giving yourself permission to contribute differently can feel much harder.", "rule": "You may already recognize that working more isn’t creating the freedom or recognition you expected. You’ve probably promised yourself more time for strategy, visibility, or developing your own ideas. But when that time arrives, immediate tasks pull you back. Somewhere in your understanding of your value, you may be carrying a demanding rule: I earn my place through what I produce. If I’m capable of doing more, I should.", "cost": ["That rule can make a full day of meaningful thinking feel strangely inadequate. You might clarify a direction, reconsider an important assumption, or make a decision that saves months of unnecessary work—and still feel guilty because you haven’t crossed enough things off your list. Visible output gives you something concrete to point to. Without it, you can start questioning whether you’ve done enough to justify your day.", "There may also be a quiet expectation underneath your effort: If I keep delivering excellent work, people will eventually recognize what I’m capable of and give me greater opportunity. So you prove yourself again before asking. You finish everyone else’s priorities before expressing your own ambitions. When recognition doesn’t arrive, you can feel overlooked or resentful—and respond by working even harder.", "Meanwhile, people keep seeing the contribution you consistently make available: your ability to execute. They bring you more delivery work. You become increasingly occupied with fulfilling expectations while getting fewer opportunities to shape them. As a founder, you can build yourself a demanding job inside your own business. As a leader, you can become known for carrying the workload while your judgment and strategic perspective remain less visible.", "The difficult part is that slowing down can bring you face-to-face with questions that being busy lets you postpone. What do you actually want to lead? What deserves your attention? What would you ask for if you weren’t trying to earn it through another achievement? You can want those answers and still fill the space with something easier to complete."], "capacity": "The capacity you need to grow is the ability to remain connected to your value when you aren’t producing immediate evidence of it. To protect time for direction while tasks remain unfinished. To ask for an opportunity without first accepting another responsibility. To let a successful achievement stand without immediately turning it into a new minimum. To rest without waiting until exhaustion makes the decision for you.", "awareness": "You may understand this pattern and still reach for another task when the discomfort arrives. Crossing this threshold means having more choice at that moment—when completing something would reassure you, but another use of your attention would serve your growth. It means allowing your priorities and judgment to carry weight before you’ve exhausted yourself proving how hardworking you are.", "beyond": "Beyond this threshold, you can become more deliberate about what receives your effort. You can make your thinking visible, initiate the conversation you’ve been postponing, and create room for opportunities that don’t come with a ready-made task list. Your contribution can expand through the direction you set, the decisions you make, and the work you choose to stop carrying.", "invite": "If you recognize yourself here, this is the work we can deepen together. We strip back the patterns and internal rules that keep following you into how you lead, communicate, make decisions, perform under pressure, create impact, and put yourself forward—including the ones that have made you disciplined, accomplished, and exceptionally good at delivering.", "question": "What becomes possible when a quieter day no longer puts your value into question? When you can claim space for your ideas, ask for more, and leave some work unfinished without feeling that you’ve failed to earn your place?", "closing": "You’ve already shown how much you can accomplish through relentless effort. There’s more to discover when you have the capacity to choose where that effort goes—and who you get to become beyond what you produce. That’s what we get to explore beyond your threshold."}, {"opening": "You want your ideas to carry weight. You want to put yourself forward, claim bigger opportunities, and be recognized for what you can contribute. Yet when the opportunity gets closer, you start noticing what you still lack. Another qualification. Stronger results. More experience. Recognition from someone established. You can see the next step, but you keep finding another condition you need to meet before taking it.", "rule": "You may already recognize this pattern. You’ve probably reached milestones you once believed would make you feel ready, only to discover that the feeling hasn’t arrived. Somewhere in your definition of authority, you may be carrying a demanding rule: Before I can claim this space, I need enough external proof that nobody can reasonably question whether I belong.", "cost": ["That rule keeps moving the point at which you’re allowed to begin. You complete the training, then decide you need more experience. You gain the experience, then feel you need more impressive results. You achieve results, then compare yourself with someone whose reputation seems more legitimate. Each achievement matters, but the permission you expected it to give you remains just out of reach.", "Learning offers something reassuring here. There are requirements to follow, material to master, and someone who can confirm that you’ve met the standard. Putting your own perspective into the world asks something different of you. You have to decide what you can responsibly contribute without knowing whether people will welcome it, respect it, or agree that you’re qualified enough.", "This can follow you into how you communicate. You explain the framework clearly but hesitate to state your own recommendation. You give more weight to a prestigious title than to your relevant experience. You know what you think until someone more established enters the conversation, and suddenly your position feels less substantial. People encounter your knowledge while getting less access to the judgment you’ve developed through using it.", "The cost grows with every opportunity you postpone. The offer stays unspoken. The application remains unfinished. The idea becomes another subject to research. You gain more knowledge while missing opportunities to discover how you handle responsibility, questions, and disagreement. And, while you are busy studying the map to ensure you are fully permitted to speak, or act, competitors with a fraction of your knowledge but twice your courage are out in the real world building roads, making mistakes, and taking the market."], "capacity": "The capacity you need to grow is the ability to contribute without securing another endorsement first. To recognize a genuine gap in competence without treating every feeling of uncertainty as evidence of one. To state a considered recommendation while being clear about its limits. To remain connected to your experience around someone with a more impressive title. To let participation give you information about what you can do.", "awareness": "You may understand all of this and still find yourself looking for another course before making the move. Crossing this threshold means having more choice at that moment—when additional preparation feels reassuring, but you already have enough competence to take a responsible next step. It means allowing your judgment to become visible while there is still room for it to develop.", "beyond": "Beyond this threshold, you can pursue opportunities that match what you bring today. You can use established knowledge while giving people access to your own conclusions. You can ask a question without feeling that it exposes your right to be in the room, and hear a challenge without immediately handing your authority back to someone else. Your experience begins to shape decisions because you’re willing to put it forward.", "invite": "If you recognize yourself here, this is the work we can deepen together. We strip back the patterns and internal rules that keep following you into how you lead, communicate, make decisions, perform under pressure, create impact, and put yourself forward—including the ones that have made you knowledgeable, conscientious, and deeply committed to being good at what you do.", "question": "What becomes possible when another person’s credentials no longer make you disappear from the conversation? When you can claim an opportunity, express your perspective, or stand behind a recommendation without waiting for someone more established to confirm that you’re allowed?", "closing": "You’ve already invested so much in becoming someone with something valuable to contribute. There’s more to discover when you have the capacity to let that contribution be seen. That’s what we get to explore beyond your threshold."}], "pairFull": [[null, ["This becomes particularly exhausting when you’re responsible for other people’s work. You stay close to the details, but when someone resists an expectation, you soften it or take the work back. You end up carrying the responsibility while wondering why delegation hasn’t given you more space.", "Your threshold is being able to hold a clear agreement without personally securing every step or keeping everyone comfortable with it. To address a missed commitment without taking over. To let someone express frustration while you remain clear about what reasonably needs to happen."], ["You can spend a remarkable amount of time trying to make your contribution easy to accept. You refine the wording, anticipate objections, and prepare explanations. Yet one cold response can still leave you questioning the whole interaction. Next time, you prepare even more, while your ideas take longer to reach people.", "Your threshold is allowing a considered contribution to receive a response you couldn’t prevent. To let someone question the idea without immediately rewriting it—or your opinion of yourself. To remain in the conversation when preparation hasn’t secured the acceptance you hoped for."], ["Being helpful gives you a dependable way to feel accepted. You make yourself available, carry more, and become someone people rely on. But changing that arrangement brings two uncomfortable possibilities: someone may be disappointed, and they may discover they can manage without you. Your own priorities keep waiting while you preserve a role that is becoming exhausting.", "Your threshold is allowing your relationships to withstand both a boundary and a change in how useful you are. To let someone need less from you without rushing to offer more. To give yourself a place in the relationship beyond what you provide."], ["You keep delivering, hoping the results will make your value obvious enough that asking for more becomes easier. Before stating your price, requesting greater authority, or protecting your priorities, you do something else to prove you deserve it. When another request arrives, declining feels like risking the recognition you’ve worked so hard to earn.", "Your threshold is making an honest request before adding another achievement or concession. To let someone consider what you want without immediately sweetening it. To maintain a limit even when you could technically squeeze in more work."], ["You look for stronger evidence that your position deserves to be heard. Another qualification or endorsement seems as though it might make disapproval easier to withstand. Around people whose opinions matter, you may explain respected frameworks while leaving your own conclusion unstated. People encounter your knowledge without fully encountering your judgment.", "Your threshold is putting forward a considered perspective without waiting for an established person to authorize it. To hear disagreement without immediately reaching for another credential. To give your experience a voice before you know whether the room will welcome it."]], [["You want the work handled properly, but holding people to expectations can become difficult when they react badly. You check more, phrase instructions more carefully, or quietly correct things yourself. The direct conversation remains unresolved, and your involvement keeps expanding.", "Your threshold is being able to leave responsibility with someone while addressing what needs to change. To tolerate their reaction without withdrawing the expectation. To let the agreement carry more of the work, rather than relying on repeated checking to compensate for what remains unsaid."], null, ["Stepping back becomes harder when you can still see ways the work could improve. An acceptable result may leave you uneasy because you know how you would refine it. So you rewrite, adjust, and introduce another review. People learn that meeting the agreement may still be insufficient to earn your confidence.", "Your threshold is letting the agreed standard be enough when the consequences support it. To distinguish a meaningful quality issue from a difference in preference. To allow work to leave your hands without requiring it to demonstrate your personal standard in every detail."], ["Staying involved can reassure you twice: you know what is happening, and you know you still matter to the outcome. You want people to become capable, yet their independence can leave you unsure where your contribution belongs. You find reasons to remain central, and the system continues organizing itself around you.", "Your threshold is allowing an outcome to succeed without your intervention. To welcome someone’s growing judgment without searching for another point of control. To discover how your leadership can matter when fewer decisions need to pass through you."], ["When progress feels uncertain, doing the work yourself offers immediate relief and something tangible to show for your effort. You move quickly, fix the issue, and restore momentum. But each intervention gives you more to deliver and others fewer opportunities to carry the outcome themselves.", "Your threshold is resisting the pull of the quickest personal solution when it would reinforce the same dependence. To leave room for someone else’s learning curve. To spend your attention on direction and accountability even when completing the task yourself would feel more productive."], ["You may feel you need a complete understanding before you can safely release a decision or responsibility. More research, another expert opinion, or a stronger framework promises reassurance. Yet the point at which you know enough keeps moving, and decisions remain attached to your search for certainty.", "Your threshold is acting on sufficient evidence while acknowledging what remains unknown. To use expertise without asking it to remove every risk. To let capable people exercise judgment without first mastering everything you would need to do their work yourself."]], [["Your standard can rise further when you’re trying to prevent an uncomfortable reaction. You work on the idea and on making it impossible to misunderstand, dislike, or reject. When someone still seems unconvinced, you question whether you should have prepared more carefully. Being seen becomes an increasingly elaborate exercise.", "Your threshold is letting good work exist alongside mixed reactions. To receive a question without treating it as a failed performance. To allow someone time to form their own opinion without immediately improving, explaining, or softening what you put forward."], ["You may struggle to trust work you haven’t personally shaped. Even after someone meets the brief, you can see details to correct and methods to improve. Your standards become difficult to separate from your involvement, and people hesitate to finish anything without your review.", "Your threshold is allowing quality to be achieved through an approach you wouldn’t have chosen. To establish what matters before the work begins and honor those criteria afterward. To let a capable person own the result without requiring your fingerprints on every part of it."], null, ["Being the person who catches every weakness can become an important part of your place in the team. People rely on your final review, and you become accustomed to saving work from being less polished than it could be. Stepping away can feel like lowering standards and surrendering the contribution that makes you essential.", "Your threshold is allowing quality to become something others can develop and sustain. To let them make judgments you would usually make for them. To remain valuable while fewer things require your correction before they can move forward."], ["The work needs another revision, but you also expect yourself to keep producing. You push harder to satisfy both demands, then judge yourself for how long everything takes. An achievement brings little space to recover before you’re trying to reproduce it at an even higher standard.", "Your threshold is allowing completion to be real. To let work meet its purpose and stop. To protect the time a meaningful contribution requires without measuring your value by how many additional tasks you managed to finish alongside it."], ["You can find reasons to question both the work and your right to put it forward. The idea needs more refinement; you need more experience. A new course promises to address the gap, but finishing it reveals another requirement. Preparation becomes a place where your potential remains protected from an actual response.", "Your threshold is contributing within your current competence while letting both your thinking and your confidence develop through participation. To release a useful idea without requiring it to prove your complete readiness for everything that might follow."]], [["You make yourself available partly because being needed feels secure and partly because disappointing someone feels costly. Each request becomes another opportunity to demonstrate that you care. Changing the arrangement can feel like withdrawing something that keeps the relationship close, so you continue giving after you’ve started resenting the demand.", "Your threshold is allowing your place to survive an honest limit. To let someone adjust to your reduced availability without immediately compensating. To remain generous while making room for needs and ambitions that don’t directly benefit the person asking for help."], ["You want others to become independent, but their growing ownership brings uncertainty about the outcome and your place in it. You remain the person who checks, resolves, and approves. The team continues depending on you, and you have little opportunity to discover what your role could become beyond that dependence.", "Your threshold is letting people carry meaningful responsibility without preserving a hidden point of intervention. To accept that their capability may make you less necessary in the daily work while creating room for a different contribution from you."], ["Your ability to improve things can make you the person everyone waits for. You catch the missed detail, refine the proposal, and turn acceptable work into something stronger. But when your value becomes attached to being the final pair of eyes, every imperfection offers another reason to stay involved.", "Your threshold is allowing others to own work that meets its purpose without your final refinement. To let them develop standards through experience. To know that leaving something untouched doesn’t erase what you bring."], null, ["The more you produce, the more people rely on you; the more they rely on you, the harder it becomes to stop producing. You can feel proud of what you carry and exhausted by how little room remains for anything else. Your own growth keeps getting whatever energy is left after everyone has what they need.", "Your threshold is allowing a quieter contribution without treating it as a loss of importance. To leave appropriate work with others and protect your direction. To let your place remain secure on days when you haven’t rescued anyone or exceeded expectations."], ["You may keep making yourself useful because it feels easier than claiming a broader contribution. Solving another problem provides immediate evidence that you belong. Expressing your own direction asks you to trust a judgment that hasn’t yet received the same recognition. People keep seeing your support while your ambition remains less visible.", "Your threshold is putting forward what you want to lead before securing your place through more service. To let people consider your perspective on its merits. To allow your contribution to change without first proving that you’ve earned permission to outgrow the old one."]], [["You’re quick to respond to what other people need and slower to protect what matters to you. Delivering keeps relationships smooth and gives you evidence that you’re doing enough. But the workload grows faster than your influence, and asking for change becomes harder when people have grown accustomed to your willingness.", "Your threshold is letting someone encounter a limit before you’ve exhausted yourself making everything work. To state your ambition directly. To tolerate a disappointed response without immediately offering more output to restore their confidence in you."], ["You can usually see a faster route through the work, so taking over feels efficient. It gives you progress, reassurance, and a visible result. But your ability to execute keeps pulling you back into tasks other people need to learn to own. Growth starts generating more personal workload instead of more collective capacity.", "Your threshold is allowing short-term efficiency to give way when someone else’s ownership matters more. To accept a different pace within clear limits. To remain focused on the broader direction when completing the task yourself would provide quicker satisfaction."], ["You expect yourself to deliver a great deal and make each contribution difficult to fault. That combination leaves little room for an ordinary day. You can finish substantial work and still feel behind because it took too long or could have been better. Success becomes a demanding standard you must immediately repeat.", "Your threshold is choosing an appropriate level of effort and allowing it to be enough. To complete work without adding a final round of proof. To let an achievement count before converting it into tomorrow’s minimum expectation."], ["Being needed keeps your task list full, and completing those tasks reassures you of your value. You become the person who can always carry a little more. Yet each rescue reinforces a role you’re increasingly tired of occupying, while the priorities that would expand your influence remain postponed.", "Your threshold is letting people manage without your immediate contribution. To leave some requests with their owners and tolerate the unfamiliar space that creates. To give your own direction attention before another person’s urgency makes the decision for you."], null, ["You keep accumulating results in the hope that one more achievement will make you ready to ask for greater opportunity. There is always another target to hit before the proposal, another success to demonstrate before the change in direction. Your track record grows while the move you want to make stays conditional.", "Your threshold is using the evidence you already have. To put yourself forward before adding another line to the case for your legitimacy. To let a conversation about your future happen while some uncertainty about your readiness remains."]], [["You want stronger backing partly because you hope it will make your position easier for others to accept. An endorsement or qualification seems as though it could protect you from an uncomfortable response. Yet around someone whose opinion matters, you can still defer even when your experience gives you grounds to contribute.", "Your threshold is letting your judgment enter the conversation before you know it will be welcomed. To hear disagreement without assuming your legitimacy has been withdrawn. To remain present around established people without making yourself smaller to preserve their approval."], ["You may look for enough knowledge to feel that you can anticipate what will happen next. Research expands, questions multiply, and decisions remain open while you seek a firmer basis for acting. The requirement to be qualified becomes entangled with the requirement to feel certain.", "Your threshold is recognizing when you have enough understanding for a responsible next step. To state what you know, name what remains uncertain, and move. To allow experience to answer questions that further preparation cannot settle in advance."], ["You keep preparing the person and polishing the contribution. Even after gaining the qualification, the work still needs refining; even after refining the work, you can imagine someone more qualified to present it. Each route returns you to another readiness requirement.", "Your threshold is putting a useful contribution forward while both you and the work remain open to development. To let questions reveal what needs strengthening without turning them into evidence that you should have waited. To build confidence through participation as well as preparation."], ["You may have an established place as the knowledgeable person who helps everyone else move forward. Being consulted confirms that your expertise matters, but claiming your own direction feels more exposed. You continue supporting other people’s decisions while waiting to feel legitimate enough to lead something of your own.", "Your threshold is allowing your knowledge to serve your own position, too. To make a proposal that carries your judgment. To let your role evolve beyond being the person who supplies answers for everyone else’s ambitions."], ["You keep adding achievements to the evidence that you deserve a larger opportunity. Finishing another project feels more concrete than putting yourself forward, so you return to delivery. People have plenty of proof that you can work hard while getting fewer chances to see what you would choose to lead.", "Your threshold is claiming the opportunity before you’ve removed every doubt about deserving it. To explain the contribution you can make and let that be considered. To stop requiring another cycle of output before your own ambition receives attention."], null]]};
const MAP=[[1,8,15,22,29,36],[2,9,16,23,30,37],[3,10,17,24,31,38],[4,11,18,25,32,39],[5,12,19,26,33,40],[6,13,20,27,34,41]];
const CHOICE=[7,14,21,28,35,42];
// Preview is intentionally offline. No personal data is transmitted or persisted.
// Production: POST lead to /api/leads, then POST {leadId,answers,assessmentVersion} to /api/assessments.
// Server must validate and recompute results; email/PDF delivery must use its canonical report.
let answers=Array(42).fill(undefined),page=0,person={name:'',email:'',newsletter:false};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function score(a){const scores=MAP.map((ids,i)=>{const v=ids.map(n=>a[n-1]).filter(x=>Number.isInteger(x)&&x>=1&&x<=10);return {i,n:v.length,value:v.length>=4?v.reduce((s,x)=>s+x,0)/v.length:null}});const ranked=scores.filter(s=>s.value!==null).sort((a,b)=>b.value-a.value||a.i-b.i);const top=ranked[0];const leaders=top&&top.value>=6?ranked.filter(s=>s.value>=6&&top.value-s.value<=.5):[];const secondary=top?ranked.filter(s=>s.value>=6&&top.value-s.value>.5&&top.value-s.value<=1.5):[];return {scores,ranked,leaders,secondary};}
function landing(){app.innerHTML=`<div class="hero"><section><h1>Your Identity<br><span class="accent">Threshold Map</span></h1><p class="lead">You want more authority, bolder leadership, and greater influence? Cool.</p><p>But what happens when more eyes are on you? When you need to make a difficult decision, take a meaningful risk, or delegate? How much of yourself can you hold when you need to be visible, step in, make a decision, and take ownership?</p><p class="fine">Explore the patterns shaping your voice, judgment, and choices as the stakes rise.</p><div class="divider"></div><small>42 statements · Your personal threshold map</small></section><section class="panel"><h3>Meet your threshold.</h3><p class="fine">Enter your details first, then answer honestly. Your result appears immediately after the assessment and you will receive a full report on your email in PDF form.</p><div id="lead" role="group" aria-label="Your details"><label for="name">First name</label><input id="name" name="name" type="text" maxlength="80" autocomplete="given-name" required><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required><label class="check"><input id="news" type="checkbox"><span>I'd also like Marija’s newsletter about identity, leadership, and communication.</span></label><p id="lead-error" class="error" role="alert" aria-live="polite"></p><button id="begin-map" type="button" style="width:100%">Begin my map ↗</button></div><p class="fine" style="margin-top:18px;margin-bottom:0">Preview: details stay in this tab. No email is sent. You can print your result as a PDF.</p></section></div><div class="footer">This tool is a reflective coaching assessment designed exclusively for personal development, self-awareness, and forward-looking growth. <strong>It is not a clinical evaluation, psychological diagnostic tool, or a substitute for professional medical or mental health advice, diagnosis, or treatment.</strong></div>`;const begin=()=>{const name=document.getElementById('name'),email=document.getElementById('email'),error=document.getElementById('lead-error');if(!name.value.trim()){error.textContent='Please enter your first name to begin.';name.focus();return;}if(!email.value.trim()||!email.validity.valid){error.textContent='Please enter a valid email address to begin.';email.focus();return;}person={name:name.value.trim(),email:email.value.trim(),newsletter:document.getElementById('news').checked};page=0;quiz();window.scrollTo(0,0);};document.getElementById('begin-map').onclick=begin;document.getElementById('lead').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();begin();}};}
