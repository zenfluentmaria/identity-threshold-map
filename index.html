function quiz(){const start=page*6,end=start+6;app.innerHTML=`<div class="topline"><span class="eyebrow">Your threshold map</span><span>${page+1} / 7</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="42" aria-valuenow="${answers.filter(x=>x!==undefined).length}"><span style="width:${start/42*100}%"></span></div><h2>Notice what feels familiar.</h2><p class="fine">Think about the past three months. 1 = not at all true · 5–6 = moderately true · 10 = very true.</p><div id="questions" role="group" aria-label="Assessment statements">${DATA.questions.slice(start,end).map((q,j)=>{let k=start+j;return `<div class="question" id="q${k}"><fieldset><legend><span class="fine">${k+1}.</span> ${esc(q)}</legend><div class="ratings">${Array.from({length:10},(_,n)=>`<label class="rating"><input type="radio" name="q${k}" value="${n+1}" ${answers[k]===n+1?'checked':''}><span>${n+1}</span></label>`).join('')}</div><div class="anchors"><span>Not at all true</span><span>Very true</span></div><label class="na"><input type="radio" name="q${k}" value="na" ${answers[k]===null?'checked':''}> Not applicable</label></fieldset></div>`}).join('')}<p class="error" id="error" role="alert"></p><div class="nav"><button type="button" class="ghost" id="back">${page?'← Back':'← Introduction'}</button><button id="continue-map" type="button">${page===6?'Reveal my map ↗':'Continue →'}</button></div></div>`;document.getElementById('questions').onchange=e=>{if(e.target.name?.startsWith('q')){answers[Number(e.target.name.slice(1))]=e.target.value==='na'?null:Number(e.target.value);}};document.getElementById('back').onclick=()=>{if(page){page--;quiz()}else landing();window.scrollTo(0,0)};document.getElementById('continue-map').onclick=()=>{const missing=Array.from({length:6},(_,j)=>start+j).find(k=>answers[k]===undefined);if(missing!==undefined){document.getElementById('error').textContent='Please answer each statement or select “Not applicable.”';document.querySelector(`#q${missing} input`).focus();return}if(page<6){page++;quiz()}else result();window.scrollTo(0,0)};}
function assembleReport(a){
const r=score(a);let paragraphs=[],title='',subtitle='',primary=null,secondary=null;
if(!r.ranked.length){title='Your map needs more context.';paragraphs=['Too few statements applied to your experience to identify a pattern responsibly. You can review your answers, or bring the situations that did resonate into a conversation with Marija.'];}
else if(!r.leaders.length){title='No single pattern stands out strongly.';paragraphs=['Your answers don’t strongly endorse one of these patterns. That can reflect your current capacity, your circumstances, or what these statements capture. It is not a verdict on your potential or a reason to manufacture a problem.','You can explore the relative tendencies below and notice whether one becomes more relevant under particular kinds of pressure.'];}
else{
primary=r.leaders.slice().sort((x,y)=>{const cx=a[CHOICE[x.i]-1],cy=a[CHOICE[y.i]-1];return (cx??11)-(cy??11)||x.i-y.i})[0].i;
if(r.leaders.length>1){title=r.leaders.map(x=>DATA.names[x.i]).join(' + ');subtitle='Shared leading patterns';secondary=r.leaders.find(x=>x.i!==primary)?.i??null;}else{title=DATA.names[primary];secondary=r.secondary[0]?.i??null;subtitle=secondary!==null?'With '+DATA.names[secondary]+' as your secondary pattern':'Your leading pattern';}
const core=DATA.cores[primary],c=a[CHOICE[primary]-1],band=c===null?null:c<=3?0:c<=7?1:2;
paragraphs.push(core.opening);
paragraphs.push((r.leaders.length>1?'One of your leading patterns is ':'This is why your leading pattern is ')+DATA.names[primary]+'. '+DATA.explanations[primary]);
paragraphs.push(core.rule);
if(r.leaders.length>1)paragraphs.push('These patterns share the lead in your answers: '+r.leaders.map(x=>DATA.names[x.i]).join(', ')+'. We are starting with '+DATA.names[primary]+' as an exploration focus, using your corresponding choice answer where available. This is a shared profile, rather than a clear single dominant pattern.');
if(secondary!==null){
paragraphs.push((r.leaders.length>1?'Alongside this, ':'Your secondary pattern, ')+DATA.names[secondary]+(r.leaders.length>1?', also shares the lead. ':', adds another layer. ')+DATA.explanations[secondary]);
const pair=DATA.pairFull[primary][secondary];paragraphs.push(pair[0]);
// A pairing replaces the core cost and capacity sections; it does not lengthen them by stacking.
if(band!==2&&band!==null)paragraphs.push(pair[1]);
}else{
for(let p of core.cost){
if(primary===3&&p.startsWith('The gap you don’t see')&&(band===2||band===null))continue;
if(primary===3&&p.startsWith('The gap you don’t see')&&band===1)p='You can end up treating your presence like a paid subscription service, renewing your place through personal intervention. You want to scale your influence, yet the pull to become necessary can reappear even when you have begun stepping back. Each time it determines your response, the system remains more dependent on your availability than you want it to be.';
paragraphs.push(p);
}
if(band!==2&&band!==null)paragraphs.push(core.capacity);
}
if(band===null){paragraphs.push('Your answers don’t give us enough information about how available a different response feels. Notice a moment when this pattern appears: what do you feel pulled to do, and what choices seem available? We won’t assume that recognizing yourself here means you are unable to respond differently.');}
else if(band===0&&secondary===null){paragraphs.push(core.awareness);}
else{paragraphs.push(DATA.choice[band][primary]);}
paragraphs.push(core.beyond,core.invite,core.question,core.closing);
}
return {...r,primary,secondary,title,subtitle,reportParagraphs:paragraphs};
}
function result(){const report=assembleReport(answers);const r=report;const {primary,secondary,title,subtitle,reportParagraphs:paragraphs}=report;
const scoreHtml=r.scores.map(s=>`<div class="score">${DATA.names[s.i]} <b>${s.value===null?'Not enough answers':s.value.toFixed(1)+' / 10'}</b></div>`).join('');
app.innerHTML=`<article class="report"><div class="report-head"><div class="eyebrow">${esc(person.name)}’s identity threshold map</div><h1>${esc(title)}</h1><p class="accent">${esc(subtitle)}</p></div>${paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="note">Your result is ready on this page. This preview does not send email or save your details. Use “Print / save PDF” to keep a copy.</div><div class="actions"><button id="print">Print / save PDF</button><button class="ghost" id="review">Review my answers</button><button class="ghost" id="restart">Start again</button></div><details><summary>Explore my pattern scores</summary><div class="scores">${scoreHtml}</div><p class="fine">Scores are averages of your answers, not percentages or diagnoses. At least four applicable answers are required per pattern. Choice responses are interpreted separately. Reporting thresholds are provisional.</p></details><div class="footer">The Identity Threshold · Marija Meshkova<br>Assessment version 1.1-preview · Reflective coaching assessment</div></article>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('review').onclick=()=>{page=0;quiz();window.scrollTo(0,0)};document.getElementById('restart').onclick=()=>{if(confirm('Clear your answers and begin again?')){answers=Array(42).fill(undefined);person={name:'',email:'',newsletter:false};landing();window.scrollTo(0,0)}};window.thresholdResult={version:'1.1-preview',...report};}
document.getElementById('brand').onclick=e=>{e.preventDefault();if(answers.some(x=>x!==undefined)){if(!confirm('Return to the introduction? Your answers remain in this tab.'))return;}landing()};
window.thresholdTest={score,assembleReport,MAP,CHOICE,DATA};landing();
</script></body></html>
